# All thresholds are starting values (spec section 2). Tune from replays, never by guessing live.

objects:
  keys: target
  pill_bottle: target
  wallet: target
  glasses: target
  phone: target
  remote: target
  box: container
  notebook: cover

# Text prompts for YOLO-World (path A), per object
prompts:
  keys: [keys, key ring]
  pill_bottle: [pill bottle, medicine bottle]
  wallet: [wallet]
  glasses: [glasses, eyeglasses]
  phone: [phone, smartphone]
  remote: [remote control, tv remote]
  box: [cardboard box, small box]
  notebook: [notebook]
  hand: [hand]

# Detector (spec 3.3). model: a .pt or a .engine built in the Jetson container (python -m core.detect
# --export). Path B swaps in the fine-tuned model; its class names must be the object names + hand.
detect:
  model: models/yolov8s-worldv2-askroom.engine   # built on the Jetson from the .pt below (scripts/dock.sh)
  world_pt_baked: models/yolov8s-worldv2-askroom.pt   # prompts baked in on the Mac, CLIP removed
  world_pt: models/yolov8s-worldv2.pt
  imgsz: 640
  half: true
  min_conf: 0.05             # model floor; per-object cut-offs are conf_threshold below

# Open-world proposals (core/proposals.py): class-agnostic 'thing' boxes for core/things.py. The
# Detector builds the proposer from here; kind switches between change detection and YOLOE.
proposals:
  enabled: true
  kind: change               # change (empty-table reference, no model) | yoloe (prompt-free checkpoint)
  roi_margin_cm: 2.0         # proposals only inside the calibrated table outline grown by this
  dedupe:                    # a proposal that is a known object or a hand is dropped (px boxes)
    known_iou: 0.5
    known_inside: 0.7        # share of the proposal inside a known box
    known_contain: 0.8       # share of a known box inside the proposal ...
    known_grow: 2.0          # ... when the proposal is at most this many times its area
    hand_iou: 0.3
    hand_inside: 0.5
    self_iou: 0.5
    self_inside: 0.8
  change:
    work_px: 480             # working long side: Mac 2.3 ms/frame; Orin Nano ~13 ms (320: ~7.5, 640: ~17)
    ref_frames: 10           # empty-table reference = median of this many frames (startup, reset)
    reference: null          # or a saved empty-table image (same camera pose) to start from
    adopt_frames: 5
    k_sigma: 4.0
    noise_cap: 3.0
    floor_l: 10.0            # LAB 0-255 units
    floor_c: 7.0
    shadow_ratio: [0.35, 0.95]
    shadow_chroma: 10.0
    min_area_frac: 0.0004    # of the frame (~370 px at 720p)
    max_area_frac: 0.15
    refresh_alpha: 0.03
    drift_alpha: 0.002
    rebuild_frac: 0.4
    rebuild_frames: 45
    ignore_px: []            # extra [x1, y1, x2, y2] boxes never to propose in
  yoloe:
    model: models/yoloe-26s-seg-pf.pt   # or a .engine exported from it in the Jetson container
    conf: 0.15
    imgsz: 640
    half: false              # .pt on a GPU only; an .engine has its precision baked in
    masks: false
  crops:                     # core/crops.py: best-clean + latest crop per object / proposal
    enabled: true
    size_px: 128
    max_tracks: 48
    recent_every_s: 0.5

# Spoken names -> object names (used by intents and answers)
synonyms:
  key: keys
  car keys: keys
  keychain: keys
  pills: pill_bottle
  pill: pill_bottle
  pill bottle: pill_bottle
  medicine: pill_bottle
  medication: pill_bottle
  meds: pill_bottle
  purse: wallet
  billfold: wallet
  spectacles: glasses
  specs: glasses
  eyeglasses: glasses
  reading glasses: glasses
  cell phone: phone
  cellphone: phone
  cell: phone
  mobile: phone
  iphone: phone
  remote control: remote
  tv remote: remote
  clicker: remote
  the box: box
  container: box
  book: notebook
  notepad: notebook

# How each object is spoken
display_names:
  pill_bottle: pill bottle

conf_threshold:
  default: 0.35

present_k_of_n: [6, 10]      # frames to count as present
absent_k_of_n: [1, 10]       # at most this many of the window to count as absent
contact_overlap: 0.30        # hand box covering object box
contact_window_s: 1.0        # touch must be this recent for HELD
cover_overlap: 0.60          # cover box over last object box
cover_moved_window_s: 3.0    # cover must have moved this recently
container_dwell_s: 0.3       # hand inside container box
reappear_wait_s: 2.0         # wait before concluding INSIDE
edge_margin: 0.05            # fraction of frame counted as edge
held_timeout_s: 30
moved_min_cm: 5              # below this, PUT_BACK not MOVED
settle_s: 0.5                # carried in view: untouched this long ...
settle_cm: 1.5               # ... and moved less than this since => set down
hand_lost_s: 0.5             # holding hand unseen this long counts as lost
cover_moved_min_cm: 2.0      # cover centre must shift this much to count as "moved"
lifted_overlap_max: 0.2      # cover now overlaps less than this of the child's last box => lifted
max_nesting: 3

# Confidence assigned by each world rule (spec 3.5)
conf_held: 0.9
conf_under: 0.85
conf_under_unknown: 0.6
conf_inside: 0.85
lifted_cover_penalty: 0.5

# Background / appearance model (world.py): catches unknown covers and detector misses
bg_frames: 30
bg_change_threshold: 25.0    # mean abs diff (0-255) inside a box; tune on replays
appearance_match: 0.7        # normalized correlation with last-seen patch => still there
bg_update_every_s: 1.0       # refresh period (~25 ms each at 320 px)
ambiguity_penalty: 0.7
decay_per_min: 0.99
answer_plain: 0.7
answer_hedge: 0.5

frame_size_px: [1280, 720]
table:
  size_cm: [90, 60]
  # ArUco 0-3 (DICT_4X4_50) marker centres in table cm, clockwise from top-left. Measure these.
  markers:
    0: [0, 0]
    1: [90, 0]
    2: [90, 60]
    3: [0, 60]

# Pulse microseconds per axis. Must be the MEASURED range that just covers the table (H1), not
# full servo travel: calibrate() spreads its grid over these limits, so wide limits miss the table.
servo_limits:
  pan: [600, 2400]
  tilt: [600, 2400]
actuator: fake               # pca9685 | serial | bus | fake
pan_channel: 0
tilt_channel: 1
pca9685_address: 0x40
serial_port: /dev/ttyUSB0
serial_baud: 115200
serial_timeout_s: 0.1
camera_latency_s: 0.06       # measure on the rig with act.calibrate.measure_latency, then set
laser_channel: 15
laser_timeout_s: 10
laser_tol_cm: 2.0             # closed-loop aim stops within this (1 cm makes SG90-class servos hunt)
shiny_objects: [phone, keys]  # aim 3 cm to the side
shiny_offset_cm: 3

# Open world (core/things.py): class-agnostic 'thing' proposals become entities thing:1, thing:2, ...
# Every key is optional (defaults in ThingsConfig). Identity is causal first; appearance only
# confirms, and needs an embedder injected as World(cfg, events, embed=...).
# teach_zone_cm: [0, 45, 20, 60]   # the teach square in table cm (x1, y1, x2, y2); unset: the thing
                                   # put down most recently (within openworld.teach_recent_s) is named
openworld:
  enabled: true
  proposal_conf: 0.25        # 'thing' proposals below this are ignored
  area_cm2: [4, 900]         # plausible object size; bigger blobs are table / background
  gate_cm: 8                 # a visible thing keeps the nearest proposal within this, per frame
  hand_gate_cm: 4            # a held thing is the proposal at its hand's boxes of the last ...
  hand_trail_s: 2.0          # ... this many seconds
  emerge_cm: 12              # 'next to' the box / notebook when a hidden thing comes out
  resurrect_sim: 0.92        # appearance alone brings a thing back only above this ...
  resurrect_margin: 0.10     # ... and this far ahead of every other thing (a twin blocks it)
  maybe_sim: 0.70            # a new thing is linked 'maybe the same as' an old one above this
  exemplar_max: 8            # appearance views kept per thing
  teach_recent_s: 30

# Stretch (D15, D16)
floor_zones: {}               # per zone: table edge, ArUco 4-7 positions in table cm, head preset pan/tilt
edge_drop_cm: 10
search_k_of_n: [4, 6]
search_timeout_s: 8
room_map: room_map.json
room_targets: [phone, wallet, remote, glasses]
laser_max_height_cm: 100

# Runtime
paths:
  events_db: data/events.db
  snapshots: data/snapshots
  table_cal: table_cal.json
  laser_cal: laser_cal.json

llm:
  base_url: https://api.x.ai/v1
  model: grok-4.3
  reasoning_effort: none
  timeout_s: 4

tts:
  elevenlabs_voice_id: ""     # set in .env as ELEVENLABS_VOICE_ID to override
  elevenlabs_model: eleven_flash_v2_5
  piper_voice: en_US-lessac-medium
  output_device: null         # sounddevice index or part of the name (python -m voice.tts --devices); null = default (HDMI in the container)

net:
  check_host: https://api.x.ai
  interval_s: 5
  timeout_s: 0.3

server:
  host: 0.0.0.0
  port: 8000
  push_hz: 5
  mjpeg_fps: 10

sms:
  whitelist: []               # E.164 numbers allowed to text questions, e.g. "+14045550123"

stt:
  # auto: whisper-server (model stays loaded) > whisper-cli > pywhispercpp, whichever this machine has,
  # so one config works on the Mac (build-mac) and the Jetson (build). scripts/build_whisper.sh builds both.
  backend: auto               # auto | server | cli | pywhispercpp
  model: base.en              # ggml model name (models/whisper/ggml-base.en.bin) or a path
  cli_binary: whisper-cli     # name, path, or found in third_party/whisper.cpp/build{,-mac}/bin
  server_binary: whisper-server
  server_port: 8178           # 127.0.0.1; a healthy server already on this port is reused
  audio_ctx: 0                # sized (clip length) | N fixed | 0 = full 30 s window; sized clips garbled here
  prompt_synonyms: true       # Whisper prompt also lists the synonyms (fixed 'meds' -> 'mids')
  end_drop_db: 10             # crowd noise: after speech, blocks this far below the asker's level are quiet; null = Silero only
  threads: 4
  max_s: 6
  silence_ms: 700             # this long below the VAD's off threshold after speech ends the question
  no_speech_s: 4              # give up if nobody starts talking
  vad_threshold: 0.5          # Silero speech probability; off threshold is this - 0.15
  input_device: null          # sounddevice device index or name; null = default mic

main:
  clicker_name: ""            # part of the evdev device name, if more than one keyboard sends PageDown
  perception_max_fps: 15
  net_copy_s: 5

demo_check:
  camera: 0
  home_cm: {}                 # object: [x, y] table cm of the demo layout; empty = check 7 only needs VISIBLE
  home_tol_cm: 5

understand:
  enabled: true               # false = rule parser only
  url: http://127.0.0.1:8081/v1   # local Qwen (llama-server, scripts/qwen_server.sh): only for backend qwen or auto (default grok; not installed on the Jetson)
  model: Qwen3-1.7B-Q4_K_M.gguf   # in models/qwen/ (scripts/qwen_server.sh; scripts/eval_understand.py scores it)
  timeout_s: 1.5              # slower than this, the rule parser answers instead
  answer_timeout_s: 4         # open questions (voice/local_llm.py); slower = the fallback sentence

n8n:
  webhook_url: ""             # e.g. http://192.168.55.100:5678/webhook/ask-the-room (laptop over USB-C); "" = off
  token: ""                   # sent as x-askroom-token; set the same in the workflow's Settings node

listen:
  mode: always                # always: answer what's meant for the rig | wake: only "room, ..." | click: clicker only
  wake_words: [room]          # also lets overheard speech reset or ask open questions ("room, reset")
  idle_s: 8                   # reopen the mic after this long with nobody talking
  echo_tail_s: 0.4            # keep the mic shut this long after the rig stops speaking

# Re-ID crop embedder (core/embed.py) for open-world identity: World(cfg, events, embed=make_embedder(cfg)).
# Off: the world has no appearance evidence (as before). DINOv2-S/14 ONNX from
# experiments/openset/weights (not in git). The first TensorRT build takes ~75 s on the Orin and runs
# on a background thread (no appearance until it is done); later starts load models/cache/reid.
reid:
  enabled: false
  model: models/reid/dinov2_s14.onnx
  providers: [tensorrt, cuda, cpu]   # tried in order; drop cpu to stay off if the GPU paths fail
  input_size: 224
  margin: 0.08               # of the box, each side
  fit: letterbox             # letterbox | stretch
  max_batch: 8               # TensorRT profile 1..max_batch
  cache_dir: models/cache/reid

# Episode narration (core/narration.py): after each burst of activity at the table, a VLM describes what
# the person did, grounded in the world model's events, for 'what was I doing before lunch?' and 'what
# happened while I was away?'. PRIVACY: when enabled, keyframes of the table (hands and objects; the
# camera sees nothing else) are sent to the provider below; the dashboard state says so. Off by default.
narration:
  enabled: false
  provider: grok             # grok (xAI, OpenAI-compatible) | claude | fake (offline demo / tests)
  model: grok-4.3
  base_url: https://api.x.ai/v1
  api_key_env: XAI_API_KEY   # read from the environment only, never logged
  reasoning_effort: none     # none: ~3.5 s per 8-frame episode vs ~9.6 s at low, same summaries (grok-4.3, Sat)
  quiet_s: 4                 # no hands and no world events this long ends an episode
  max_episode_s: 120         # longer episodes are split
  min_episode_s: 2           # shorter ones without a world event are not narrated
  keyframe_every_s: 1.0      # plus one at every world event
  keyframes: 24              # kept per episode (thinned evenly beyond this)
  frame_px: 640              # keyframe long side (JPEG under snapshots/narration, pruned after keep_h)
  max_images: 8              # per VLM call
  max_per_hour: 30           # VLM calls per hour (cost cap)
  max_queued: 20             # episodes kept for later while offline (oldest dropped first)
  timeout_s: 30
  keep_h: 24

# Visual memory (core/visual_memory.py, voice/visual.py): questions about what the camera sees now
# ('what does the note say?') or saw before ('was there a red mug here this morning?'). PRIVACY: when
# enabled, the current frame and (for past questions) up to recall_frames saved frames are sent to the
# provider below; the archive itself stays on this device. On for the demo (Sat 26 Sep); needs
# XAI_API_KEY and internet, and offline these questions say they need the connection.
visual_memory:
  enabled: true
  provider: grok
  model: grok-4.3
  base_url: https://api.x.ai/v1
  api_key_env: XAI_API_KEY
  reasoning_effort: none     # on the voice path: answer fast
  timeout_s: 8
  max_per_hour: 60           # VLM calls per hour; over it, questions fall back to the world model
  look_px: 1280              # current frame long side sent
  crop_px: 384               # close-ups of named objects are upscaled to this
  max_crops: 3
  abstain_below: 0.5         # VLM confidence under this: "I can't tell from here."
  recall_frames: 6           # saved frames sent per past-tense question
  recall_px: 768
  archive:
    archive_every_s: 30      # a frame is kept at least this often ...
    check_every_s: 1.0       # ... and on a settled scene change, checked this often
    change_thr: 0.3          # % of 128x72 thumbnail pixels changed by > 20 grey levels
    frame_px: 1280
    jpeg_quality: 80
    max_mb: 500              # disk cap for saved frames (oldest go first)
    keep_h: 24
  embed:
    embed: onnx              # onnx (MobileCLIP2-S0: python scripts/export_mobileclip.py) | fake | none
    image_model: models/mobileclip2_s0_image.onnx
    text_model: models/mobileclip2_s0_text.onnx
    vocab: assets/bpe_simple_vocab_16e6.txt.gz
    providers: [tensorrt, cuda, cpu]
    cache_dir: models/cache/clip
    tiles: [3, 2]            # tile grid embedded besides the whole frame (small objects)
    min_sim: 0.21            # best text match below this: "I don't remember seeing that"

# Care layer (voice/care.py): reminders, morning report + caregiver summary, follow-up questions, profile
# facts. Proactive speech is capped; notices past the cap or in quiet hours are recorded, not spoken.
care:
  enabled: true
  tick_s: 10                  # scheduler: reminders checked against the event log this often
  quiet_hours: []             # e.g. ["22:00", "07:00"]: reminders recorded but not spoken in between; off for the hackathon
  max_notices_per_hour: 4
  notice_expiry_min: 30       # unacknowledged notices leave /state after this
  ack_window_s: 60            # 'okay' / 'thanks' / 'done' this soon after a notice acknowledges it
  late_grace_min: 30          # a reminder found this late (app was off) is skipped, not fired
  morning_report: true
  morning_after: "06:00"      # the first question or table activity after this (and before noon) gets it
  morning_until: "12:00"
  morning_on_activity: true
  conversation_ttl_s: 120     # follow-ups ('and my glasses?') use the last turns until this much silence
  conversation_turns: 5
  profile_llm: true           # online: free-form 'about me' statements go to Grok (llm: section) as strict JSON

# Demo behaviour (main.py, voice/care.py).
demo:
  thinking_cue_s: 1.0         # no answer this long after a spoken question (Grok reading or answering it):
                              # say a short phrase so the rig isn't silent; 0 = off
  thinking_phrases: ["Let me look.", "One moment.", "Hmm, let me check."]   # used in turn
  hold_notices: false         # true: nothing speaks unasked (reminders, morning report); notices still
                              # show on /state and the phone. Turn on if reminders would talk over a judge.

# One-tag table calibration (core/table.py): ONE printed AprilTag 36h11 lying anywhere on the table replaces
# markers 0-3, so nothing is measured. Print: python scripts/make_markers.py --tag (160 mm), then set size_cm
# to the black square's side as printed (check with a ruler). The tracked area becomes what the camera sees
# of the table; it is saved with the calibration and applied at the next start. false = four markers.
table_tag:
  enabled: true
  family: apriltag_36h11
  id: 0
  size_cm: 16.0               # black square side as printed
  frames: 15                  # corner positions averaged over this many consecutive frames
  max_cm: 250                 # cap on the tracked area (a steep camera sees far across the plane)

# Known-object boxes dropped before the world sees them (core/detect.py). Zero-shot YOLO-World labels a
# hand as 'phone' / 'wallet' next to its 'hand' box (per-class NMS keeps both): a known box this close to
# a hand box is the hand. Also dropped: boxes too big for any prop, and boxes whose centre is off the
# table (a phone in someone's pocket). The change proposer and thing candidates also reject motion
# (proposals.change still_frames / moving_frac, openworld still_cm / still_s; defaults in the code).
detect_filter:
  hand_iou: 0.6
  max_area_frac: 0.25         # of the frame
  table_margin_cm: 5.0        # null = keep boxes off the table

# Room pointing (spec 0006, roadmap: off for the demo). The laser points at image pixels anywhere the camera
# can see the dot, with no depth: a dot map (python -m act.room_map --sweep, nobody in view) gives the first
# guess, and a pixel-space closed loop finishes. Fires only inside zones drawn on the map
# (python -m act.room_map --zone NAME --poly x,y ...), never with a hand or person box on the beam path,
# and for at most room_dwell_s. The map path is the `room_map` key above.
room:
  enabled: false
  grid: [20, 15]              # sweep pulse grid (pan x tilt) over servo_limits; ~2-3 min on the rig
  n_pairs: 3                  # laser on/off pairs averaged per look (a far dot is faint)
  tol_px: 12                  # stop when the dot is this close to the target (or inside the object's box)
  deadband_us: 8              # SG90 dead band: smaller steps don't update the Jacobian
  jump_px: 30                 # dot moved this much more than predicted: it landed on something nearer
  max_map_gap_px: 60          # refuse targets farther than this from every mapped dot
  room_dwell_s: 5             # room aims turn off after this (the table keeps laser_timeout_s)
  require_zone: true          # fire only inside a zone polygon (floor, furniture tops; never eye level)
  head_px: null               # [u, v] where the pan-tilt head appears in the image, for the beam-path check
  hand_recent_s: 2            # hand boxes seen this recently block a room aim
  person_check: true          # also run OpenCV HOG for standing people before each room aim
  person_clear_s: 5           # the sweep needs nobody seen for this long, and stops when someone appears
